<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#080d16"/><meta name="description" content="THE FALL — a cinematic descent through the four Yugas."/>
<title>THE FALL — A Journey Through Time</title></head>
<body><div id="app">
<canvas id="world" aria-label="THE FALL 3D game scene"></canvas><div class="vignette"></div>
<header class="topbar">
<a class="brand" href="#" aria-label="The Fall home">THE<span>FALL</span><i></i></a>
<div class="era-block"><span class="eyebrow">CURRENT TIMELINE</span><strong id="era-name">SATYA YUGA</strong><small id="era-subtitle">WORLD 01 / 04</small></div>
<div class="score-block"><span class="eyebrow">TIME FRAGMENTS</span><strong id="score">000000</strong></div>
</header>
<main class="center-ui"><div class="intro" id="intro">
<p class="eyebrow intro-kicker">AN ENDLESS JOURNEY THROUGH EXISTENCE</p>
<h1>YOU WERE<br/><em>NEVER</em> MEANT TO LAND.</h1>
<p class="intro-copy">Four Yugas. Four ages. One impossible descent.</p>
<div class="start-actions"><button id="play-button" class="primary-button">START FALLING <span>↗</span></button><button id="watch-button" class="text-button">WATCH THE JOURNEY</button></div>
<p class="hint">A / D OR ← / → TO STEER · SPACE TO PAUSE</p>
</div><div class="transition-title" id="transition-title" aria-live="polite"><span>ENTERING NEXT AGE</span><strong id="transition-world">TRETA YUGA</strong></div></main>
<footer class="bottom-ui">
<div class="stat"><span class="eyebrow">DISTANCE FALLEN</span><strong id="distance">000 m</strong></div>
<div class="fall-meter"><span id="fall-meter-fill"></span></div><div class="controls-note" id="mode-label">READY WHEN YOU ARE</div>
<button id="sound-button" class="icon-button" aria-label="Toggle sound">SOUND ON</button><button id="pause-button" class="icon-button" aria-label="Pause game">Ⅱ</button>
</footer><div class="toast" id="toast" role="status"></div></div>
<script type="module" src="/src/main.ts"></script></body></html>
